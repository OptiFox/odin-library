<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project: Library</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Odin Library</h1>
  <button id="showDialog"><img src="icons/plus.svg" alt="plus">New Book</button>
  <!-- <output></output> -->

  <dialog id="addBookDialog">
    <form id="addBookForm" method="dialog">
      <p>
        <label for="title">Title:</label>
        <input type="text" name="title" id="title" required>
      </p>

      <p>
        <label for="author">Author:</label>
        <input type="text" name="author" id="author" required>
      </p>

      <p>
        <label for="pages">Pages:</label>
        <input type="number" name="pages" id="pages" min="1" required>
      </p>

      <fieldset>
        <legend>Have you read this book?</legend>
        <label for="yes">
          <input type="radio" name="read" id="yes" value="yes" required>
          Yes
        </label>
        <label for="no">
          <input type="radio" name="read" id="no" value="no">
          No
        </label>
      </fieldset>

      <div>
        <button type="submit" formnovalidate>Cancel</button>
        <button type="submit" id="btnConfirm">Confirm</button>
        <!-- <button type="button" onclick="readStatus()">click</button> used for testing -->
      </div>
    </form>
  </dialog>

  <div class="container">
    <!-- <div class="card" data-index-number="1234">
      <p class="id">UUID</p>
      <h1 class="title">Placeholder Title</h1>
      <h2 class="author">Author</h2>
      <p class="pages">Pages: <span></span></p>
      <p class="read">Read Status:<span class="indicator"></span></p>
      <button class="delete"><img src="icons/delete.svg" alt="delete">Delete</button> -->
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
